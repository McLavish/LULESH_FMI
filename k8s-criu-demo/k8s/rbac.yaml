# The orchestrator finds the machine pods, execs `fmi-rank-agent evacuate-local` into machine A,
# scales machine A's Deployment to zero once its ranks are staged, and reads pod logs (the
# migration-window marker, the survivors' exit lines, rank 0's energy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lulesh-orchestrator
  namespace: lulesh-criu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lulesh-orchestrator
  namespace: lulesh-criu
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # kubectl exec POSTs (verb "create"); the python client's websocket exec is a
    # GET upgrade, which the API server authorizes as verb "get". Both are needed.
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lulesh-orchestrator
  namespace: lulesh-criu
subjects:
  - kind: ServiceAccount
    name: lulesh-orchestrator
    namespace: lulesh-criu
roleRef:
  kind: Role
  name: lulesh-orchestrator
  apiGroup: rbac.authorization.k8s.io
